apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rds-credentials
  namespace: dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: rds-credentials
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: username
      remoteRef:
        key: REPLACE_WITH_TERRAFORM_OUTPUT_RDS_MASTER_SECRET_ARN
        property: username
    - secretKey: password
      remoteRef:
        key: REPLACE_WITH_TERRAFORM_OUTPUT_RDS_MASTER_SECRET_ARN
        property: password
    - secretKey: host
      remoteRef:
        key: REPLACE_WITH_TERRAFORM_OUTPUT_RDS_MASTER_SECRET_ARN
        property: host
    - secretKey: port
      remoteRef:
        key: REPLACE_WITH_TERRAFORM_OUTPUT_RDS_MASTER_SECRET_ARN
        property: port
    - secretKey: dbname
      remoteRef:
        key: REPLACE_WITH_TERRAFORM_OUTPUT_RDS_MASTER_SECRET_ARN
        property: dbname
