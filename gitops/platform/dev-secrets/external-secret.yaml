apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rds-credentials
  namespace: dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: rds-credentials
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: username
      remoteRef:
        key: arn:aws:secretsmanager:eu-west-1:275544662748:secret:eks-platform-reliability-lab/dev/app-runtime-eoT5mY
        property: username
    - secretKey: password
      remoteRef:
        key: arn:aws:secretsmanager:eu-west-1:275544662748:secret:eks-platform-reliability-lab/dev/app-runtime-eoT5mY
        property: password
