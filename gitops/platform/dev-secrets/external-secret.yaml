        key: arn:aws:secretsmanager:eu-west-1:275544662748:secret:rds!db-853d8e7b-13ce-4a51-94c1-a186338b8a4d-QnBHFP
        property: host
    - secretKey: port
      remoteRef:
        key: arn:aws:secretsmanager:eu-west-1:275544662748:secret:rds!db-853d8e7b-13ce-4a51-94c1-a186338b8a4d-QnBHFP
        property: port
    - secretKey: dbname
      remoteRef:
        key: arn:aws:secretsmanager:eu-west-1:275544662748:secret:rds!db-853d8e7b-13ce-4a51-94c1-a186338b8a4d-QnBHFP
