apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fastapi-auth
  namespace: dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: fastapi-auth
    creationPolicy: Owner
  data:
    - secretKey: SECRET_KEY
      remoteRef:
        key: eks-platform-reliability-lab/dev/fastapi-auth
        property: SECRET_KEY
    - secretKey: FIRST_SUPERUSER
      remoteRef:
        key: eks-platform-reliability-lab/dev/fastapi-auth
        property: FIRST_SUPERUSER
    - secretKey: FIRST_SUPERUSER_PASSWORD
      remoteRef:
        key: eks-platform-reliability-lab/dev/fastapi-auth
        property: FIRST_SUPERUSER_PASSWORD
