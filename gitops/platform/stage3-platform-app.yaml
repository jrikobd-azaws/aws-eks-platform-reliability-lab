apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stage3-platform-app
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://github.com/jrikobd-azaws/aws-eks-platform-reliability-lab.git
    targetRevision: main
    path: app/helm
    helm:
      releaseName: eks-platform-app
      valueFiles:
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
