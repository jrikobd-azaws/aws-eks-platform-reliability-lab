clusterName: eks-platform-reliability-lab
region: eu-west-1
vpcId: vpc-04080cdd458d1c532

replicaCount: 2
configureDefaultAffinity: true
defaultTargetType: ip
defaultLoadBalancerScheme: internal
enableShield: false
enableWaf: false
enableWafv2: false
enableServiceMutatorWebhook: false

serviceAccount:
  create: true
  name: aws-load-balancer-controller
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::275544662748:role/eks-platform-reliability-lab-aws-load-balancer-controller

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

livenessProbe:
  failureThreshold: 3
  httpGet:
    path: /healthz
    port: 61779
    scheme: HTTP
  initialDelaySeconds: 30
  timeoutSeconds: 10
readinessProbe:
  failureThreshold: 3
  httpGet:
    path: /readyz
    port: 61779
    scheme: HTTP
  initialDelaySeconds: 10
  timeoutSeconds: 10

podSecurityContext:
  fsGroup: 65534
securityContext:
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  seccompProfile:
    type: RuntimeDefault
