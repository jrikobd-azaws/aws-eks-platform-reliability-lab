installCRDs: true
replicaCount: 1
concurrent: 1
scopedNamespace: dev
scopedRBAC: true
processClusterExternalSecret: false
processClusterStore: false
processClusterGenerator: false
processClusterPushSecret: false
processPushSecret: false

crds:
  createClusterExternalSecret: false
  createClusterSecretStore: false
  createClusterGenerator: false
  createClusterPushSecret: false
  createPushSecret: false

serviceAccount:
  create: true
  name: external-secrets
  automount: true
  annotations: {}

podSecurityContext:
  enabled: true

securityContext:
  enabled: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  seccompProfile:
    type: RuntimeDefault

livenessProbe:
  enabled: true
readinessProbe:
  enabled: true

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

webhook:
  create: true
  replicaCount: 1
  podSecurityContext:
    enabled: true
  securityContext:
    enabled: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  readinessProbe:
    enabled: true
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

certController:
  create: true
  replicaCount: 1
  podSecurityContext:
    enabled: true
  securityContext:
    enabled: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  readinessProbe:
    enabled: true
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
