apiVersion: v1
kind: ResourceQuota
metadata:
  name: dev-compute
  namespace: dev
spec:
  hard:
    requests.cpu: "1200m"
    requests.memory: 2Gi
    limits.cpu: "2"
    limits.memory: 3Gi
    pods: "20"
    persistentvolumeclaims: "4"
    requests.storage: 40Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: dev-container-defaults
  namespace: dev
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      default:
        cpu: 500m
        memory: 512Mi
      min:
        cpu: 10m
        memory: 16Mi
      max:
        cpu: "1"
        memory: 1Gi
