apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability
  namespace: argocd
spec:
  project: platform
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: "92.11.0"
      helm:
        releaseName: observability
        valueFiles:
          - $values/gitops/platform/values/observability-values.yaml
    - repoURL: https://github.com/jrikobd-azaws/aws-eks-platform-reliability-lab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-system
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - ClientSideApplyMigration=false
      - CreateNamespace=false
