apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
spec:
  project: platform
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 2.12.0
      helm:
        releaseName: external-secrets
        valueFiles:
          - $values/gitops/platform/values/external-secrets-values.yaml
    - repoURL: https://github.com/jrikobd-azaws/aws-eks-platform-reliability-lab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-system
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
