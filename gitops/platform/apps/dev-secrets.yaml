apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-secrets
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://github.com/jrikobd-azaws/aws-eks-platform-reliability-lab.git
    targetRevision: main
    path: gitops/platform/dev-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
