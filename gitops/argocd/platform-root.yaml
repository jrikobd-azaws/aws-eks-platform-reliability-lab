apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-root
  namespace: argocd
spec:
  project: platform-bootstrap
  source:
    repoURL: https://github.com/jrikobd-azaws/aws-eks-platform-reliability-lab.git
    targetRevision: main
    path: gitops/platform
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    syncOptions:
    - PruneLast=true
    automated:
      enabled: false
      prune: false
      selfHeal: false
