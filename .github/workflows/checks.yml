name: safety-checks
on: [pull_request, push]
permissions:
  contents: read
jobs:
  local-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: ShellCheck prerequisite
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: v3 launchers are still blocked
        run: python3 scripts/check-v3-patch.py
      - name: Set up Python for Stage 0 safety tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python Stage 0 safety tests
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest boto3 PyYAML==6.0.3
          python3 -m pytest -q tests/labops
      - name: Shell syntax and ShellCheck (all shell scripts)
        run: |
          find scripts -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
          find scripts -type f -name '*.sh' -print0 | xargs -0 -r shellcheck -x -P SCRIPTDIR
      - name: Catalogue (43 scenarios)
        run: python3 scripts/check_scenarios.py
      - name: Platform manifest syntax and safety invariants
        run: python3 scripts/validate-platform.py
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2 # TODO: pin to reviewed commit SHA
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.3"
      - name: Terraform fmt and validate (local static checks only)
        run: |
          terraform fmt -check -diff -recursive infra/terraform
          terraform -chdir=infra/terraform/permanent init -backend=false -input=false
          terraform -chdir=infra/terraform/permanent validate
          terraform -chdir=infra/terraform/environments/lab init -backend=false -input=false
          terraform -chdir=infra/terraform/environments/lab validate
      - name: Trivy config scan if installed
        run: |
          if command -v trivy >/dev/null 2>&1; then
            trivy config --severity HIGH,CRITICAL infra/terraform
          else
            echo 'Trivy not installed; skipping IaC security scan.'
          fi
      - name: Set up pinned Helm
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: 'v3.18.6'

      - name: Validate Helm chart and immutable images
        shell: bash
        run: |
          set -euo pipefail
          helm lint app/helm -f app/helm/values-dev.yaml
          helm template eks-platform-app app/helm --namespace dev -f app/helm/values-dev.yaml > "$RUNNER_TEMP/stage3-helm-rendered.yaml"
          python3 - "$RUNNER_TEMP/stage3-helm-rendered.yaml" <<'HELM_VALIDATION'
          import re
          import sys
          from pathlib import Path

          rendered = Path(sys.argv[1]).read_text()
          images = re.findall(r'(?m)^\s*image:\s*["\']?([^"\'\s]+)', rendered)

          if len(images) < 2:
              raise SystemExit("BLOCKED: Expected backend and frontend images")

          if not all(re.fullmatch(r".+@sha256:[a-f0-9]{64}", image) for image in images):
              raise SystemExit("BLOCKED: Application images must use immutable SHA256 digests")

          if "kind: Deployment" not in rendered or "kind: Service" not in rendered:
              raise SystemExit("BLOCKED: Missing required application resources")

          print(f"PASS: Helm validation and {len(images)} immutable images")
          HELM_VALIDATION
