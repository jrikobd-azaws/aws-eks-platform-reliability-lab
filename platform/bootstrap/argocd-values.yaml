global:
  revisionHistoryLimit: 2
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

controller:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
repoServer:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

server:
  replicas: 1
  service:
    type: ClusterIP
  ingress:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

redis:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

redis-ha:
  enabled: false

dex:
  enabled: false

notifications:
  enabled: false

applicationSet:
  enabled: false

commitServer:
  enabled: false
